name: Discount Zone Check

on:
  schedule:
    - cron: '35 14 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '5 21 * * 1-5'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discount checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python discount_checker.py
