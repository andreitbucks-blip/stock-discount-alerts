name: Discount Zone Check

on:
  schedule:
    - cron: '30 14 * * 1-5'   # 16:30 Romanian time (EET) on weekdays only
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discount checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python discount_checker.py
